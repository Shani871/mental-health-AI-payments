app:
  security:
    encryption:
      key: ${ENCRYPTION_KEY:my-super-secret-key-12345} # Replace with at least 16 chars in prod

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expirationMs: 3600000
  refreshExpirationMs: 604800000

razorpay:
  keyId: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  keySecret: ${RAZORPAY_KEY_SECRET:rzp_test_secret_placeholder}

ai:
  openai:
    apiKey: ${OPENAI_API_KEY:sk-placeholder}
    model: ${OPENAI_MODEL:gpt-4o}

zoom:
  accountId: ${ZOOM_ACCOUNT_ID:placeholder}
  clientId: ${ZOOM_CLIENT_ID:placeholder}
  clientSecret: ${ZOOM_CLIENT_SECRET:placeholder}

sms:
  provider: ${SMS_PROVIDER:mock}
  from: ${SMS_FROM:MindBridge}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: mindbridge-backend
