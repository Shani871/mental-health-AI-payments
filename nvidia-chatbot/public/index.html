<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Chat Assistant">
  <title>AI Chat Assistant</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
        </div>
        <h2>Nexus AI</h2>
      </div>
      <div class="sidebar-content">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New Chat
        </button>
      </div>
    </aside>
    
    <main class="chat-area">
      <header class="chat-header">
        <div class="model-info">
          <span class="status-dot"></span>
          <span>AI Hub Model</span>
        </div>
      </header>
      
      <div class="messages-container" id="messages-container">
        <!-- Messages will be injected here -->
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">
             <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <h1>How can I help you today?</h1>
        </div>
      </div>
      
      <div class="input-area">
        <form id="chat-form">
          <div class="input-wrapper">
            <textarea id="message-input" placeholder="Message AI..." rows="1"></textarea>
            <button type="submit" id="send-button" disabled aria-label="Send message">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
          <div class="footer-text">AI can make mistakes. Verify important information.</div>
        </form>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
